{{- if and .Values.ingress.enabled .Values.active }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  namespace: {{ .Release.Namespace }}
  name: hubble-ingress
  annotations:
{{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: "{{ $value }}"
{{- end }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: hubble
          port: 80
  tls:
    certResolver: harmonyhpc
{{- end }}

